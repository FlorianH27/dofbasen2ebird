<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DOFbasen to eBird Converter</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f9f9f9; color: #333; }
        h1 { color: #2c3e50; }
        .drop-zone { border: 3px dashed #3498db; padding: 30px; text-align: center; background: #fff; cursor: pointer; border-radius: 8px; margin-top: 20px; }
        .drop-zone.dragover { background: #ecf0f1; border-color: #2980b9; }
        .query-box { background: #fff; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #ddd; }
        .query-box h3 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .form-group label { flex: 1; font-weight: bold; font-size: 14px; }
        .form-group input { flex: 2; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .link-display { margin-top: 15px; padding: 10px; background: #f1f1f1; border-radius: 4px; word-break: break-all; font-family: monospace; font-size: 12px; }
        .link-display a { color: #2980b9; text-decoration: none; }
        .link-display a:hover { text-decoration: underline; }
        #download-container { display: none; margin-top: 20px; }
        #download-btn { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #download-btn:hover { background: #219653; }
        .ebird-link { display: inline-block; margin-left: 15px; color: #2980b9; text-decoration: none; font-weight: bold; }
        .ebird-link:hover { text-decoration: underline; }
        pre { background: #eee; padding: 10px; border-radius: 5px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>DOFbasen zu eBird Konverter</h1>
    <p>Konvertiere deine exportierte DOFbasen-CSV in das eBird-Format (exakt nach ornitho2eBird-Standard).</p>

    <!-- DOFbasen Abfrage-Parameter & Link-Generierung -->
    <div class="query-box">
        <h3>DOFbasen Abfrage-Parameter</h3>
        <div class="form-group">
            <label for="query-date-from">Datum von:</label>
            <input type="date" id="query-date-from" onchange="updateDofLink()">
        </div>
        <div class="form-group">
            <label for="query-date-to">Datum bis:</label>
            <input type="date" id="query-date-to" onchange="updateDofLink()">
        </div>
        <div class="form-group">
            <label for="query-observer">Beobachter (Observer):</label>
            <input type="text" id="query-observer" value="9990SKAF" oninput="updateDofLink()">
        </div>
        <div class="link-display">
            <strong>DOFbasen Abfragelink:</strong><br>
            <a id="dof-link" href="#" target="_blank">-</a>
        </div>
    </div>

    <div class="drop-zone" id="dropZone">
        DOFbasen CSV-Datei hierher ziehen oder klicken zum Auswählen
        <input type="file" id="fileInput" accept=".csv" style="display: none;">
    </div>

    <div id="download-container">
        <button id="download-btn">eBird CSV herunterladen</button>
        <a href="https://ebird.org/import/upload.form" target="_blank" class="ebird-link">Direkt zu eBird Upload &rarr;</a>
    </div>

    <h3>Protokoll:</h3>
    <pre id="log">Bereit...</pre>

    <script>
        // Setze Standard-Datum: "von" = gestern, "bis" = heute
        const today = new Date();
        const yyyyToday = today.getFullYear();
        const mmToday = String(today.getMonth() + 1).padStart(2, '0');
        const ddToday = String(today.getDate()).padStart(2, '0');
        document.getElementById('query-date-to').value = `${yyyyToday}-${mmToday}-${ddToday}`;

        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const yyyyYest = yesterday.getFullYear();
        const mmYest = String(yesterday.getMonth() + 1).padStart(2, '0');
        const ddYest = String(yesterday.getDate()).padStart(2, '0');
        document.getElementById('query-date-from').value = `${yyyyYest}-${mmYest}-${ddYest}`;

        function formatDateForDof(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        }

        function updateDofLink() {
            const dateFromInput = document.getElementById('query-date-from').value;
            const dateToInput = document.getElementById('query-date-to').value;
            const observer = document.getElementById('query-observer').value;

            const dateFrom = formatDateForDof(dateFromInput);
            const dateTo = formatDateForDof(dateToInput);

            const url = `https://dofbasen.dk/excel/search_result1.php?design=excel&soeg=soeg&periode=mellemdato&dato_first=${dateFrom}&dato_second=${dateTo}&obstype=observationer&species=alle&obserdata=${observer}&summering=yes&metode=17&sortering=dato`;
            
            const linkElem = document.getElementById('dof-link');
            linkElem.href = url;
            linkElem.textContent = url;
        }

        updateDofLink();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const downloadContainer = document.getElementById('download-container');
        const downloadBtn = document.getElementById('download-btn');
        const log = document.getElementById('log');

        let convertedCsvContent = "";

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function logMessage(msg) {
            log.textContent += "\n" + msg;
            log.scrollTop = log.scrollHeight;
        }

        function handleFile(file) {
            logMessage(`Lese Datei: ${file.name}...`);
            const reader = new FileReader();
            reader.readAsText(file, 'ISO-8859-1');
            reader.onload = function(e) {
                parseDofbasen(e.target.result);
            };
        }

        function formatToEbirdDate(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[1]}/${parts[2]}/${parts[0]}`;
            }
            return dateStr;
        }

        function calculateDuration(startStr, endStr) {
            if (!startStr || !endStr) return "1";
            const [h1, m1] = startStr.split(':').map(Number);
            const [h2, m2] = endStr.split(':').map(Number);
            if (isNaN(h1) || isNaN(m1) || isNaN(h2) || isNaN(m2)) return "1";
            const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            return diff > 0 ? diff.toString() : "1";
        }

        function parseDofbasen(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) {
                logMessage("Fehler: Die Datei scheint leer zu sein.");
                return;
            }

            const headers = lines[0].split(';');
            const getIndex = (name) => headers.indexOf(name);

            const idx = {
                dato: getIndex('Dato'),
                turtidfra: getIndex('Turtidfra'),
                turtidtil: getIndex('Turtidtil'),
                loknavn: getIndex('Loknavn'),
                lat: getIndex('lok_breddegrad'),
                lon: getIndex('lok_laengdegrad'),
                artnavn: getIndex('Artnavn'),
                antal: getIndex('Antal'),
                turnoter: getIndex('Turnoter'),
                fuglnoter: getIndex('Fuglnoter')
            };

            let ebirdRows = [];

            let rowCount = 0;
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(';');
                if (cols.length < headers.length) continue;

                const species = cols[idx.artnavn] || "";
                const count = cols[idx.antal] || "";
                const location = cols[idx.loknavn] || "";
                const lat = (cols[idx.lat] || "").replace(',', '.').trim();
                const lon = (cols[idx.lon] || "").replace(',', '.').trim();
                const date = formatToEbirdDate(cols[idx.dato]) || "";
                const time = cols[idx.turtidfra] || "";
                const duration = calculateDuration(cols[idx.turtidfra], cols[idx.turtidtil]);
                const notes = [cols[idx.turnoter], cols[idx.fuglnoter]].filter(Boolean).join(" | ");

                // Exakter 19-Spalten-Array gemäß ornitho2eBird Vorlage
                let row = [
                    species,                                                                           // 0
                    "",                                                                                // 1
                    "",                                                                                // 2
                    count,                                                                             // 3
                    "",                                                                                // 4
                    location,                                                                          // 5
                    lat,                                                                               // 6
                    lon,                                                                               // 7
                    date,                                                                              // 8
                    time,                                                                              // 9
                    "",                                                                                // 10
                    "",                                                                                // 11
                    "Traveling",                                                                       // 12
                    duration,                                                                          // 13
                    "",                                                                                // 14
                    "Y",                                                                               // 15
                    notes,                                                                             // 16
                    "",                                                                                // 17
                    '<small><a href="https://ornitho2ebird.com/" target="_blank" rel="noopener">Importiert mit ornitho2eBird.</a></small>' // 18
                ];

                ebirdRows.push(row);
                rowCount++;
            }

            // Generiere CSV ohne Header-Zeile (genau wie im Referenzfile)
            convertedCsvContent = ebirdRows.map(e => e.map(val => `"${val}"`).join(",")).join("\n");
            logMessage(`Erfolgreich ${rowCount} Beobachtungen konvertiert!`);
            downloadContainer.style.display = 'block';
        }

        downloadBtn.onclick = function() {
            const blob = new Blob([convertedCsvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ebird_import.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>

</body>
</html>
