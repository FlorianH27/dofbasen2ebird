<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOFbasen &rarr; eBird Converter</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #0f172a;
            --primary-hover: #334155;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --success: #10b981;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
            padding: 40px;
            border: 1px solid var(--border);
        }

        header {
            margin-bottom: 32px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .query-box {
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="date"], input[type="text"] {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="date"]:focus, input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .link-output-box {
            margin-top: 16px;
        }

        .btn-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-box:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
            text-decoration: none;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            background: #fafafa;
            padding: 32px 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.02);
        }

        .drop-zone p {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .drop-zone span {
            font-size: 12px;
            color: var(--text-muted);
        }

        #fileInput {
            display: none;
        }

        .actions {
            display: none;
            margin-top: 24px;
            gap: 12px;
            align-items: center;
        }

        .actions.visible {
            display: flex;
        }

        button {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        .log-box {
            margin-top: 20px;
            background: #0f172a;
            color: #e2e8f0;
            padding: 14px 16px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            max-height: 120px;
            overflow-y: auto;
            display: none;
        }

        .log-box.visible {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DOFbasen &rarr; eBird</h1>
            <p class="subtitle">Konvertiere deine DOFbasen-Exporte sekundenschnell und fehlerfrei in das eBird-Format.</p>
        </header>

        <div class="section-title">1. DOFbasen Abfrage-Link generieren</div>
        <div class="query-box">
            <div class="form-row">
                <div class="form-group">
                    <label for="query-date-from">Von Datum</label>
                    <input type="date" id="query-date-from" onchange="updateDofLink()">
                </div>
                <div class="form-group">
                    <label for="query-date-to">Bis Datum</label>
                    <input type="date" id="query-date-to" onchange="updateDofLink()">
                </div>
            </div>
            <div class="form-group full">
                <label for="query-observer">Beobachter Kürzel (Observer)</label>
                <input type="text" id="query-observer" value="9990SKAF" oninput="updateDofLink()">
            </div>
            <div class="link-output-box">
                <a id="dof-link" href="#" target="_blank" class="btn-box">DOFbasen-Abfrage starten &rarr;</a>
            </div>
        </div>

        <div class="section-title">2. CSV-Datei konvertieren</div>
        <div class="drop-zone" id="dropZone">
            <p>CSV-Datei hierher ziehen oder klicken</p>
            <span>Unterstützt DOFbasen Export-Dateien (.csv)</span>
            <input type="file" id="fileInput" accept=".csv">
        </div>

        <div class="log-box" id="logBox">Bereit...</div>

        <div class="actions" id="actionsContainer">
            <button id="download-btn">eBird CSV herunterladen</button>
            <button class="btn-secondary" onclick="window.open('https://ebird.org/import/upload.form', '_blank')">Zu eBird Upload</button>
        </div>
    </div>

    <script>
        const today = new Date();
        const yyyyToday = today.getFullYear();
        const mmToday = String(today.getMonth() + 1).padStart(2, '0');
        const ddToday = String(today.getDate()).padStart(2, '0');
        document.getElementById('query-date-to').value = `${yyyyToday}-${mmToday}-${ddToday}`;

        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const yyyyYest = yesterday.getFullYear();
        const mmYest = String(yesterday.getMonth() + 1).padStart(2, '0');
        const ddYest = String(yesterday.getDate()).padStart(2, '0');
        document.getElementById('query-date-from').value = `${yyyyYest}-${mmYest}-${ddYest}`;

        function formatDateForDof(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split('-');
            return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dateStr;
        }

        function updateDofLink() {
            const dateFrom = formatDateForDof(document.getElementById('query-date-from').value);
            const dateTo = formatDateForDof(document.getElementById('query-date-to').value);
            const observer = document.getElementById('query-observer').value;

            const url = `https://dofbasen.dk/excel/search_result1.php?design=excel&soeg=soeg&periode=mellemdato&dato_first=${dateFrom}&dato_second=${dateTo}&obstype=observationer&species=alle&obserdata=${observer}&summering=yes&metode=17&sortering=dato`;
            
            const linkElem = document.getElementById('dof-link');
            linkElem.href = url;
        }

        updateDofLink();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const actionsContainer = document.getElementById('actionsContainer');
        const downloadBtn = document.getElementById('download-btn');
        const logBox = document.getElementById('logBox');

        let convertedCsvContent = "";

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function logMessage(msg) {
            logBox.classList.add('visible');
            logBox.textContent += "\n" + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function handleFile(file) {
            logBox.textContent = `Lese ${file.name}...`;
            const reader = new FileReader();
            reader.readAsText(file, 'ISO-8859-1');
            reader.onload = function(e) {
                parseDofbasen(e.target.result);
            };
        }

        function formatToEbirdDate(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split('-');
            return parts.length === 3 ? `${parts[1]}/${parts[2]}/${parts[0]}` : dateStr;
        }

        function calculateDuration(startStr, endStr) {
            if (!startStr || !endStr) return "1";
            const [h1, m1] = startStr.split(':').map(Number);
            const [h2, m2] = endStr.split(':').map(Number);
            if (isNaN(h1) || isNaN(m1) || isNaN(h2) || isNaN(m2)) return "1";
            const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            return diff > 0 ? diff.toString() : "1";
        }

        function parseDofbasen(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) {
                logMessage("Fehler: Die Datei ist leer.");
                return;
            }

            const headers = lines[0].split(';');
            const getIndex = (names) => {
                if (!Array.isArray(names)) names = [names];
                for (let name of names) {
                    let idx = headers.indexOf(name);
                    if (idx !== -1) return idx;
                }
                return -1;
            };

            const idx = {
                dato: getIndex(['Dato']),
                turtidfra: getIndex(['Turtidfra']),
                turtidtil: getIndex(['Turtidtil']),
                lokalitet: getIndex(['Loknavn', 'Lokalitet', 'Loklitet', 'lok_navn']),
                lat: getIndex(['lok_breddegrad']),
                lon: getIndex(['lok_laengdegrad']),
                artnavn: getIndex(['Artnavn']),
                antal: getIndex(['Antal']),
                medobser: getIndex(['Medobser']),
                turnoter: getIndex(['Turnoter']),
                fuglnoter: getIndex(['Fuglnoter'])
            };

            let ebirdRows = [];
            let rowCount = 0;

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(';');
                if (cols.length < headers.length) continue;

                const species = cols[idx.artnavn] || "";
                const count = cols[idx.antal] || "";
                
                let locationName = (idx.lokalitet !== -1) ? (cols[idx.lokalitet] || "").trim() : "";
                if (!locationName) {
                    locationName = "Grenen, Skagen";
                }

                const lat = (idx.lat !== -1 ? cols[idx.lat] : "").replace(',', '.').trim();
                const lon = (idx.lon !== -1 ? cols[idx.lon] : "").replace(',', '.').trim();
                const date = formatToEbirdDate(idx.dato !== -1 ? cols[idx.dato] : "") || "";
                const time = idx.turtidfra !== -1 ? cols[idx.turtidfra] : "";
                const duration = calculateDuration(
                    idx.turtidfra !== -1 ? cols[idx.turtidfra] : "", 
                    idx.turtidtil !== -1 ? cols[idx.turtidtil] : ""
                );
                
                const birdDetails = idx.fuglnoter !== -1 ? (cols[idx.fuglnoter] || "") : "";
                const medobserVal = idx.medobser !== -1 ? (cols[idx.medobser] || "") : "";
                const turnoterVal = idx.turnoter !== -1 ? (cols[idx.turnoter] || "") : "";
                const checklistNotes = [medobserVal, turnoterVal].filter(Boolean).join(" | ");

                let row = [
                    species, "", "", count, birdDetails, locationName, lat, lon, date, time,
                    "Stationary", duration, "", "", "", "Y", checklistNotes
                ];

                ebirdRows.push(row);
                rowCount++;
            }

            convertedCsvContent = ebirdRows.map(e => e.map(val => `"${val}"`).join(",")).join("\n");
            logMessage(`Erfolgreich ${rowCount} Beobachtungen konvertiert.`);
            actionsContainer.classList.add('visible');
        }

        downloadBtn.onclick = function() {
            const blob = new Blob([convertedCsvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ebird_import.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>
</body>
</html>
