<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DOFbasen to eBird Converter</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f9f9f9; color: #333; }
        h1 { color: #2c3e50; }
        .drop-zone { border: 3px dashed #3498db; padding: 40px; text-align: center; background: #fff; cursor: pointer; border-radius: 8px; margin-top: 20px; }
        .drop-zone.dragover { background: #ecf0f1; border-color: #2980b9; }
        #download-btn { display: none; margin-top: 20px; padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #download-btn:hover { background: #219653; }
        pre { background: #eee; padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>DOFbasen zu eBird Konverter</h1>
    <p>Ziehe deine DOFbasen-CSV-Datei per Drag & Drop in das Feld unten, um sie in das eBird-Format zu konvertieren.</p>

    <div class="drop-zone" id="dropZone">
        DOFbasen CSV-Datei hierher ziehen oder klicken zum Auswählen
        <input type="file" id="fileInput" accept=".csv" style="display: none;">
    </div>

    <button id="download-btn">eBird CSV herunterladen</button>
    <h3>Vorschau des Log-Protokolls:</h3>
    <pre id="log">Bereit...</pre>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('download-btn');
        const log = document.getElementById('log');

        let convertedCsvContent = "";

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function logMessage(msg) {
            log.textContent += "\n" + msg;
            log.scrollTop = log.scrollHeight;
        }

        function handleFile(file) {
            logMessage(`Lese Datei: ${file.name}...`);
            const reader = new FileReader();
            reader.readAsText(file, 'ISO-8859-1'); // DOFbasen nutzt meist ISO-8859-1 / Latin1
            reader.onload = function(e) {
                parseDofbasen(e.target.result);
            };
        }

        function parseDofbasen(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) {
                logMessage("Fehler: Die Datei scheint leer zu sein.");
                return;
            }

            const headers = lines[0].split(';');
            const getIndex = (name) => headers.indexOf(name);

            const idx = {
                dato: getIndex('Dato'),
                turtidfra: getIndex('Turtidfra'),
                turtidtil: getIndex('Turtidtil'),
                loknavn: getIndex('Loknavn'),
                latin: getIndex('Latin'),
                antal: getIndex('Antal'),
                lat: getIndex('lok_breddegrad'),
                lon: getIndex('lok_laengdegrad'),
                turnoter: getIndex('Turnoter'),
                fuglnoter: getIndex('Fuglnoter')
            };

            // eBird Standard-Header (Beispiel basierend auf deinem ornitho2eBird-Beispiel)
            let ebirdRows = [["Common Name", "Gen Species", "Count", "Location Name", "Latitude", "Longitude", "Date", "Time", "Duration", "Effort Distance", "Effort Area", "Protocol", "Comments", "All Observations Reported", "Age/Sex", "Details", "Breeding Code"]];

            let rowCount = 0;
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                // Einfacher CSV Parser für Semikolon (berücksichtigt hier primär Basis-Spalten)
                const cols = lines[i].split(';');
                if (cols.length < headers.length) continue;

                const date = cols[idx.dato];
                const time = cols[idx.turtidfra] || "";
                const location = cols[idx.loknavn];
                const scientificName = cols[idx.latin];
                const count = cols[idx.antal];
                const lat = cols[idx.lat];
                const lon = cols[idx.lon];
                const notes = [cols[idx.turnoter], cols[idx.fuglnoter]].filter(Boolean).join(" | ");

                // eBird Zeile zusammenbauen
                ebirdRows.push([
                    scientificName, // als Artname
                    scientificName,
                    count,
                    location,
                    lat,
                    lon,
                    date,
                    time,
                    "", "", "", // Dauer, Distanz, Fläche
                    "Traveling", // Standard-Protokoll
                    notes,
                    "Y", // All observations reported
                    "", "", ""
                ]);
                rowCount++;
            }

            convertedCsvContent = ebirdRows.map(e => e.join(",")).join("\n");
            logMessage(`Erfolgreich ${rowCount} Beobachtungen konvertiert!`);
            downloadBtn.style.display = 'block';
        }

        downloadBtn.click = function() {
            const blob = new Blob([convertedCsvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ebird_import.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
        downloadBtn.onclick = downloadBtn.click;
    </script>

</body>
</html>
